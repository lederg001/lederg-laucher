name: Build LEDERG Launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build independent Windows EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name LEDERG-Launcher --add-data "launcher_config.json;." --collect-all minecraft_launcher_lib launcher.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDERG-Launcher-Windows
          path: dist/LEDERG-Launcher.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.1.{0}', github.run_number) }}
          name: LEDERG Launcher ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.1.{0}', github.run_number) }}
          body: |
            Independent LEDERG STALKER launcher for Minecraft Forge 1.12.2.
            Downloads only the modpack from a public Google Drive link; official Minecraft files are installed after Microsoft authentication.
            TLauncher files are not included. A Microsoft Entra Client ID with Minecraft API permission is required.
          files: dist/LEDERG-Launcher.exe
          make_latest: true
